<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Scaled glyph with high-visibility vector nodes, no background for transparency -->
  <g id="favicon-glyph">
    <!-- Outer Glow Layer -->
    <path d="M 140 140 L 200 140 L 200 372 L 140 372 Z
             M 312 140 L 372 140 L 372 372 L 312 372 Z
             M 200 140 L 260 140 L 372 372 L 312 372 Z" 
          fill="#5EEBFF" filter="url(#neonGlow)" opacity="0.65"/>
          
    <!-- Crisp Solid Core Layer -->
    <path d="M 140 140 L 200 140 L 200 372 L 140 372 Z
             M 312 140 L 372 140 L 372 372 L 312 372 Z
             M 200 140 L 260 140 L 372 372 L 312 372 Z" 
          fill="url(#primaryGrad)"/>

    <!-- Large High-Contrast Junction Nodes -->
    <!-- Node Top-Left -->
    <circle cx="170" cy="140" r="24" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="170" cy="140" r="10" fill="#FFFFFF"/>
    
    <!-- Node Bottom-Left -->
    <circle cx="170" cy="372" r="24" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="170" cy="372" r="10" fill="#FFFFFF"/>
    
    <!-- Node Top-Right -->
    <circle cx="342" cy="140" r="24" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="342" cy="140" r="10" fill="#FFFFFF"/>
    
    <!-- Node Bottom-Right -->
    <circle cx="342" cy="372" r="24" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="342" cy="372" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Gradients & Filters Definitions -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEBFF" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7CFFB2" />
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
