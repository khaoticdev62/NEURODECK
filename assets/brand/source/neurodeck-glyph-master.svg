<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with dark glass tone -->
  <rect width="512" height="512" rx="72" fill="#0A0D10" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Subtle Tactical Grid Overlay -->
  <g stroke="#5EEBFF" stroke-width="1" opacity="0.08">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Glowing background aura behind glyph -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" opacity="0.15" />

  <!-- Circuit Monogram N Geometry -->
  <g id="circuit-n">
    <!-- Outer Glow Filter Layer -->
    <path d="M 140 140 L 200 140 L 200 372 L 140 372 Z
             M 312 140 L 372 140 L 372 372 L 312 372 Z
             M 200 140 L 260 140 L 372 372 L 312 372 Z" 
          fill="#5EEBFF" filter="url(#neonGlow)" opacity="0.6"/>
          
    <!-- Crisp Solid Core Layer -->
    <path d="M 140 140 L 200 140 L 200 372 L 140 372 Z
             M 312 140 L 372 140 L 372 372 L 312 372 Z
             M 200 140 L 260 140 L 372 372 L 312 372 Z" 
          fill="url(#primaryGrad)"/>

    <!-- Circuit Paths (Tails) -->
    <!-- Left Top Tail -->
    <path d="M 170 140 L 60 140" stroke="#5EEBFF" stroke-width="4" fill="none" opacity="0.75"/>
    <rect x="80" y="132" width="4" height="16" fill="#5EEBFF" opacity="0.6"/>
    <!-- Left Bottom Tail -->
    <path d="M 170 372 L 60 372" stroke="#5EEBFF" stroke-width="4" fill="none" opacity="0.75"/>
    <rect x="80" y="364" width="4" height="16" fill="#5EEBFF" opacity="0.6"/>
    <!-- Right Top Tail -->
    <path d="M 342 140 L 452 140" stroke="#5EEBFF" stroke-width="4" fill="none" opacity="0.75"/>
    <rect x="428" y="132" width="4" height="16" fill="#5EEBFF" opacity="0.6"/>
    <!-- Right Bottom Tail -->
    <path d="M 342 372 L 452 372" stroke="#5EEBFF" stroke-width="4" fill="none" opacity="0.75"/>
    <rect x="428" y="364" width="4" height="16" fill="#5EEBFF" opacity="0.6"/>

    <!-- Glowing Junction Nodes -->
    <!-- Node Top-Left -->
    <circle cx="170" cy="140" r="16" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="170" cy="140" r="8" fill="#FFFFFF"/>
    
    <!-- Node Bottom-Left -->
    <circle cx="170" cy="372" r="16" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="170" cy="372" r="8" fill="#FFFFFF"/>
    
    <!-- Node Top-Right -->
    <circle cx="342" cy="140" r="16" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="342" cy="140" r="8" fill="#FFFFFF"/>
    
    <!-- Node Bottom-Right -->
    <circle cx="342" cy="372" r="16" fill="#5EEBFF" filter="url(#nodeGlow)"/>
    <circle cx="342" cy="372" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Gradients & Filters Definitions -->
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEBFF" />
      <stop offset="100%" stop-color="#5EEBFF" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEBFF" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7CFFB2" />
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
