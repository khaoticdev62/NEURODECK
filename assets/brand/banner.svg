<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <filter id="b-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="b-node" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="b-bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <linearGradient id="b-sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <radialGradient id="b-ng" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#005588"/>
    </radialGradient>
    <radialGradient id="b-accent-glow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#b-bg)"/>
  <!-- Accent glow blob -->
  <rect width="1280" height="640" fill="url(#b-accent-glow)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="128" y1="0" x2="128" y2="640"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="384" y1="0" x2="384" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="896" y1="0" x2="896" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
    <line x1="1152" y1="0" x2="1152" y2="640"/>
  </g>

  <!-- ══ LARGE ICON MARK — left side ══ -->
  <!-- Left vertical -->
  <line x1="140" y1="120" x2="140" y2="480" stroke="url(#b-sg)" stroke-width="28" stroke-linecap="round" filter="url(#b-glow)"/>
  <!-- Right vertical -->
  <line x1="340" y1="120" x2="340" y2="480" stroke="url(#b-sg)" stroke-width="28" stroke-linecap="round" filter="url(#b-glow)"/>
  <!-- Diagonal -->
  <line x1="140" y1="120" x2="340" y2="480" stroke="url(#b-sg)" stroke-width="28" stroke-linecap="round" filter="url(#b-glow)"/>
  <!-- Glow lines -->
  <line x1="140" y1="120" x2="140" y2="480" stroke="#00f0ff" stroke-width="6" opacity="0.6" stroke-linecap="round" filter="url(#b-node)"/>
  <line x1="340" y1="120" x2="340" y2="480" stroke="#00f0ff" stroke-width="6" opacity="0.6" stroke-linecap="round" filter="url(#b-node)"/>
  <line x1="140" y1="120" x2="340" y2="480" stroke="#00f0ff" stroke-width="6" opacity="0.6" stroke-linecap="round" filter="url(#b-node)"/>
  <!-- Nodes -->
  <circle cx="140" cy="120" r="22" fill="url(#b-ng)" filter="url(#b-node)"/>
  <circle cx="140" cy="120" r="9" fill="#fff" opacity="0.95"/>
  <circle cx="340" cy="120" r="22" fill="url(#b-ng)" filter="url(#b-node)"/>
  <circle cx="340" cy="120" r="9" fill="#fff" opacity="0.95"/>
  <circle cx="140" cy="480" r="22" fill="url(#b-ng)" filter="url(#b-node)"/>
  <circle cx="140" cy="480" r="9" fill="#fff" opacity="0.95"/>
  <circle cx="340" cy="480" r="22" fill="url(#b-ng)" filter="url(#b-node)"/>
  <circle cx="340" cy="480" r="9" fill="#fff" opacity="0.95"/>
  <circle cx="240" cy="300" r="16" fill="url(#b-ng)" filter="url(#b-node)"/>
  <circle cx="240" cy="300" r="7" fill="#fff" opacity="0.9"/>
  <!-- Corner brackets on mark -->
  <g stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.4">
    <polyline points="88,72 88,52 108,52"/>
    <polyline points="392,52 412,52 412,72"/>
    <polyline points="88,528 88,548 108,548"/>
    <polyline points="412,528 412,548 392,548"/>
  </g>

  <!-- Vertical separator -->
  <line x1="468" y1="80" x2="468" y2="560" stroke="#00f0ff" stroke-width="1" opacity="0.15"/>

  <!-- ══ RIGHT SIDE — TEXT CONTENT ══ -->
  <!-- NEURODECK heading -->
  <text x="510" y="248"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="96"
        font-weight="700"
        letter-spacing="8"
        fill="#00f0ff"
        filter="url(#b-glow)">NEURODECK</text>

  <!-- Tagline -->
  <text x="514" y="306"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="20"
        font-weight="400"
        letter-spacing="5"
        fill="#00f0ff"
        opacity="0.55">AI TERMINAL OS  ·  STEAM DECK NATIVE</text>

  <!-- Feature pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" letter-spacing="2">
    <!-- Pill 1: Gemini + Ollama -->
    <rect x="514" y="346" width="168" height="28" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="598" y="365" text-anchor="middle" fill="#00f0ff" opacity="0.8">GEMINI / OLLAMA</text>

    <!-- Pill 2: Tauri + Rust -->
    <rect x="694" y="346" width="136" height="28" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="762" y="365" text-anchor="middle" fill="#00f0ff" opacity="0.8">TAURI + RUST</text>

    <!-- Pill 3: Lua Plugins -->
    <rect x="842" y="346" width="130" height="28" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="907" y="365" text-anchor="middle" fill="#00f0ff" opacity="0.8">LUA PLUGINS</text>

    <!-- Pill 4: Vector RAG -->
    <rect x="514" y="386" width="118" height="28" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="573" y="405" text-anchor="middle" fill="#00f0ff" opacity="0.8">VECTOR RAG</text>

    <!-- Pill 5: Warpinator -->
    <rect x="644" y="386" width="130" height="28" rx="4" fill="#ff0055" fill-opacity="0.08" stroke="#ff0055" stroke-width="1" stroke-opacity="0.35"/>
    <text x="709" y="405" text-anchor="middle" fill="#ff0055" opacity="0.8">WARPINATOR</text>

    <!-- Pill 6: Prompt Lab -->
    <rect x="786" y="386" width="124" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="1" stroke-opacity="0.35"/>
    <text x="848" y="405" text-anchor="middle" fill="#00ff88" opacity="0.8">PROMPT LAB</text>
  </g>

  <!-- Bottom build tag -->
  <text x="514" y="540"
        font-family="'JetBrains Mono', monospace"
        font-size="12"
        letter-spacing="3"
        fill="#00f0ff"
        opacity="0.2">BUILD 20260523  ·  github.com/khaoticdev62/NEURODECK</text>

  <!-- Corner decorations -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.3">
    <polyline points="24,24 24,8 40,8"/>
    <polyline points="1240,8 1256,8 1256,24"/>
    <polyline points="24,616 24,632 40,632"/>
    <polyline points="1256,616 1256,632 1240,632"/>
  </g>
  <!-- Red accent dot -->
  <circle cx="1232" cy="580" r="6" fill="#ff0055" opacity="0.7"/>
  <circle cx="1232" cy="580" r="12" fill="none" stroke="#ff0055" stroke-width="1" opacity="0.3"/>
</svg>
