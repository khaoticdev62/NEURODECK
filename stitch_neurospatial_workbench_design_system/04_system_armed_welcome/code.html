            transform: scale(1.05);
            transition: all 0.2s ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        .neural-pulse-idle {
            border: 2px solid rgba(200, 191, 255, 0.3);
