        }

            width: 8px;
        }

            background: theme('colors.surface-container-lowest');
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: theme('colors.surface-container-highest');
            border-radius: theme('borderRadius.full');

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden neural-bg">
<!-- Focused View Header (Navigation excluded due to task-flow rule) -->
<header class="flex items-center justify-between px-lg py-md border-b border-surface-container-highest bg-surface/80 backdrop-blur-md z-20 shrink-0">

<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg text-on-surface">Model Ingestion</h1>
</div>
<div class="flex items-center gap-sm text-surface-tint">
<span class="material-symbols-outlined pulse-slow text-sm" data-icon="radar">radar</span>
<span class="font-label-md">Scanning Local</span>
</div>
</header>

<div class="max-w-4xl mx-auto w-full flex flex-col gap-xl pb-[120px]">

<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent"></div>

<div>

<p class="text-on-surface-variant mt-1">Found 3 compatible weights in default directories.</p>
</div>
</div>
</div>
<!-- Discovered Models List -->

<!-- Card 1 -->

<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined" data-icon="memory">memory</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-headline-md text-on-surface">Llama-3-8B-Instruct</span>

<span>•</span>
<span>4.1 GB</span>
<span>•</span>
<span class="truncate opacity-75">~/.ollama/models/blobs/...</span>
</div>
</div>

<div class="ml-4 shrink-0">

<input class="w-6 h-6 rounded border-outline-variant bg-surface-container-lowest text-primary focus:ring-primary focus:ring-offset-background checked:border-primary cursor-pointer" type="checkbox"/>

<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
</div>

<h3 class="font-headline-md text-on-surface">Custom Path</h3>
