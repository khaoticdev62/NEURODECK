<style>
        /* Geist font face fallback since it's a premium font, we use system-ui if not loaded */
        @font-face {
            font-family: 'Geist';
            src: local('Geist'), local('system-ui');
            font-weight: 100 900;
        }

        body {
            background-color: #14121a; /* bg-background */
            color: #e5e0ec; /* text-on-surface */
            overflow: hidden;
            user-select: none;
        }

        /* Edge Lighting Pulse */
        .edge-pulse {
            box-shadow: inset 0 0 120px rgba(200, 191, 255, 0.05);
            animation: breathe 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { box-shadow: inset 0 0 80px rgba(200, 191, 255, 0.03); }
            50% { box-shadow: inset 0 0 150px rgba(200, 191, 255, 0.15); }
        }

        /* Neural Pulse Component */
        .neural-pulse-container {
            width: 120px;
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neural-ring-base {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(200, 191, 255, 0.3);
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .neural-ring-inner {
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            border: 2px dashed rgba(200, 191, 255, 0.6);
            animation: spin 8s linear infinite;
        }

        .neural-core {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(200, 191, 255, 0.8) 0%, rgba(200, 191, 255, 0) 70%);
            border-radius: 50%;
            animation: core-breathe 2s ease-in-out infinite;
            filter: blur(4px);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes core-breathe {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Terminal Logs */
        .terminal-log {
            opacity: 0;
            transform: translateY(10px);
            animation: slide-up-fade 0.3s forwards;
        }

        @keyframes slide-up-fade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col items-center justify-center relative">
<!-- Ambient Edge Lighting -->
<div class="absolute inset-0 edge-pulse"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center gap-xl">
<!-- High-Fidelity Progress Ring -->
<div class="neural-pulse-container mb-lg">
<div class="neural-ring-base"></div>
<div class="neural-ring-inner"></div>
<div class="neural-core"></div>
</div>
<!-- Status Text -->
<div class="text-center space-y-base flex flex-col items-center">
<h1 class="font-display text-display text-on-surface tracking-tight">System Hibernation</h1>
<p class="font-body-lg text-body-lg text-primary animate-pulse">Committing Neural State to NVMe</p>
</div>
</main>
<!-- Technical Log Stream -->
<div class="absolute bottom-safe-margin left-safe-margin right-safe-margin h-32 flex flex-col justify-end overflow-hidden">
<!-- Overlay fade for logs -->
<div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-background to-transparent z-10"></div>
<div class="font-code-md text-code-md text-on-surface-variant flex flex-col gap-xs relative z-0" id="log-container">
<!-- Logs will be injected here via JS -->
</div>
</div>
<script>
        const logLines = [
            "Initiating ACPI S4 state transition...",
            "Flushing write buffers to persistent storage.",
            "Dumping VRAM... [24.5 GB / 24.5 GB]",
            "Synchronizing tensor node graph.",
            "Encrypting Fragment Cache... AES-256-GCM applied.",
            "Detaching user-space agents safely.",
            "Closing active TCP/UDP ports.",
            "Saving session telemetry data.",
            "Finalizing Kernel Snapshot...",
            "Halting CPU cores [0-15].",
            "Spinning down secondary drives.",
            "System state committed successfully.",
            "Powering off auxiliary buses...",
            "Goodnight."
        ];

        const logContainer = document.getElementById('log-container');
        let currentLine = 0;

        function addLogLine() {
            if (currentLine >= logLines.length) return;

            const line = document.createElement('div');
            line.className = 'terminal-log flex items-center gap-sm';
            
            // Timestamp
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}.${now.getMilliseconds().toString().padStart(3, '0')}`;
            
            line.innerHTML = `
                <span class="text-primary/50">[${timeStr}]</span>
                <span class="text-on-surface-variant">${logLines[currentLine]}</span>
            `;

            logContainer.appendChild(line);

            // Keep only last 5 visible
            if (logContainer.children.length > 5) {
                const firstChild = logContainer.firstElementChild;
                firstChild.classList.add('fade-out');
                setTimeout(() => {
                    if (logContainer.contains(firstChild)) {
                        logContainer.removeChild(firstChild);
                    }
                }, 500);
            }

            currentLine++;

            // Variable typing speed simulation
            const nextDelay = Math.random() * 400 + 200; // 200ms to 600ms
            setTimeout(addLogLine, nextDelay);
        }

        // Start logs after a short delay
        setTimeout(addLogLine, 1000);
    </script>
</body></html>
