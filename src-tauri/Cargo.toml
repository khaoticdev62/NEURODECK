[package]
name = "app"
version = "1.8.0"
description = "NEURODECK — AI Terminal Interface for Steam Deck"
authors = ["khaoticdev62"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "query"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
futures-util = "0.3"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5"
regex = "1"
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
portable-pty = "0.9"
tokio-util = { version = "0.7", features = ["codec"] }
rand = "0.8"
anyhow = "1.0"
suppaftp = "8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
neurodeck_core = { version = "0.1.0", path = "../core" }
neurodeck_infrastructure = { version = "0.1.0", path = "../infrastructure" }
mdns-sd = "0.20.0"
tar = "0.4.40"
tonic = "0.14"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
walkdir = "2.3"
uuid = { version = "1", features = ["v4"] }
ring = "0.17.14"
headless_chrome = "1.0.18"
fx-torrent = "0.9.1"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio-cron-scheduler = "0.13"
sysinfo = "0.33"
cpal = "0.15"
hound = "3.5"
yrs = "0.21"
gilrs = "0.11.0"
tree-sitter = "0.26.9"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-bash = "0.25.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[profile.dev]
# Mitigate Windows PDB limit (LNK1318) by reducing debug info granularity
# in dev/test builds. Use `debug = 2` only when actively debugging.
debug = 1               # Line-tables only — sufficient for backtraces, smaller PDB

[profile.release]
opt-level = "s"         # Optimize for size
lto = "thin"            # Thin LTO (much faster than fat LTO)
codegen-units = 16      # Parallelize codegen
strip = true            # Strip symbols to save space and I/O time
