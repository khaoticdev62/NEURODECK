<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .stage { position: relative; height: 290px; overflow: hidden; }
  .stage.glass::before { z-index: 5; }
  .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(137,0,225,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(137,0,225,0.05) 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse 85% 90% at 55% 50%, black 0%, transparent 100%); mask-image: radial-gradient(ellipse 85% 90% at 55% 50%, black 0%, transparent 100%); z-index: 1; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; z-index: 1; }
  .orb-uv { width: 360px; height: 360px; background: radial-gradient(circle, rgba(137,0,225,0.30) 0%, transparent 65%); top: -80px; right: -80px; animation: drift 10s ease-in-out infinite; }
  .orb-lm { width: 280px; height: 280px; background: radial-gradient(circle, rgba(163,230,53,0.12) 0%, transparent 65%); bottom: -80px; left: -80px; animation: drift 14s ease-in-out infinite reverse; }
  @keyframes drift { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(25px,-35px); } }
  .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px); z-index: 3; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(11,11,13,0.9) 100%); z-index: 2; }
  .label { position: relative; z-index: 6; font-family: var(--fn-disp); font-size: 32px; font-weight: 900; color: var(--text-hi); padding: 28px; }
  .sub { position: relative; z-index: 6; font-family: var(--fn-mono); font-size: 10px; color: var(--lime); letter-spacing: 0.22em; text-transform: uppercase; padding: 0 28px; }
</style></head><body><div class="card">
  <span class="lbl">overlays · scanlines · vignette · grid · orbs</span>
  <div class="stage glass">
    <div class="hero-grid"></div>
    <div class="orb orb-uv"></div>
    <div class="orb orb-lm"></div>
    <div class="scan"></div>
    <div class="vig"></div>
    <p class="sub">// signature stack</p>
    <h2 class="label">Engineering<br/><span style="color: var(--lime);">The Future_</span></h2>
  </div>
  <span class="token">All four overlays compose into the hero. Scanlines + vignette are DEFAULT-ON sitewide.</span>
</div></body></html>
