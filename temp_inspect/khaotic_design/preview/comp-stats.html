<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .stat { padding: 20px; text-align: right; }
  .stat::after { left: auto !important; right: 0 !important; top: 18% !important; bottom: 18% !important; width: 2px !important; height: auto !important; background: var(--uv) !important; opacity: 1 !important; filter: none !important; }
  .stat-n { font-family: var(--fn-disp); font-size: 36px; font-weight: 900; color: var(--text-hi); line-height: 1; }
  .stat-n .u { color: var(--lime); font-size: 18px; }
  .stat-l { font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 6px; }
</style></head><body><div class="card">
  <span class="lbl">stat box · right-aligned · UV right-border</span>
  <div class="grid">
    <div class="stat glass-tile uv">
      <div class="stat-n">$0<span class="u">K</span></div>
      <div class="stat-l">Overhead</div>
    </div>
    <div class="stat glass-tile uv">
      <div class="stat-n">48<span class="u">hr</span></div>
      <div class="stat-l">Sprint Cycles</div>
    </div>
    <div class="stat glass-tile uv">
      <div class="stat-n">100<span class="u">%</span></div>
      <div class="stat-l">Autonomous</div>
    </div>
  </div>
  <span class="token">Orbitron 900 number · lime unit · STM all-caps label. Right-align + UV border = signature.</span>
</div></body></html>
