<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .panel { padding: 18px; }
  .track { position: relative; height: 28px; background: var(--void); border-radius: 8px; overflow: hidden; box-shadow: inset 0 1px 4px rgba(0,0,0,0.5); }
  .box { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; background: var(--lime); border-radius: 4px; box-shadow: 0 0 12px var(--lime-glow); animation: slide 2.4s var(--ease) infinite alternate; }
  .e1 { --ease: cubic-bezier(0.2, 0.8, 0.2, 1); }
  .e2 { --ease: cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes slide { from { left: 4px; } to { left: calc(100% - 24px); } }
  .row-mo { display: grid; grid-template-columns: 100px 1fr; gap: 12px; align-items: center; padding: 8px 0; }
  .nm { font-family: var(--fn-mono); font-size: 11px; color: var(--text-hi); }
  .hx { font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); }

  .glitch-wrap { position: relative; display: inline-block; font-family: var(--fn-disp); font-weight: 900; font-size: 38px; color: var(--text-hi); }
  .glitch-wrap::before, .glitch-wrap::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .glitch-wrap::before { color: var(--uv-400); animation: gb 3s infinite; clip-path: polygon(0 15%, 100% 15%, 100% 35%, 0 35%); }
  .glitch-wrap::after  { color: var(--lime); animation: ga 3s infinite; clip-path: polygon(0 65%, 100% 65%, 100% 85%, 0 85%); }
  @keyframes gb { 0%, 80%, 100% { transform: translateX(0); opacity: 0; } 84% { transform: translateX(-4px); opacity: 0.9; } 88% { transform: translateX(4px); opacity: 0.9; } 92% { opacity: 0; } }
  @keyframes ga { 0%, 80%, 100% { transform: translateX(0); opacity: 0; } 86% { transform: translateX(3px); opacity: 0.9; } 90% { transform: translateX(-3px); opacity: 0.9; } 94% { opacity: 0; } }
</style></head><body><div class="card">
  <span class="lbl">motion</span>
  <div class="glass panel">
    <div class="row-mo"><div class="col" style="gap:2px;"><span class="nm">ease-out</span><span class="hx">default · 250ms</span></div><div class="track"><div class="box e1"></div></div></div>
    <div class="row-mo"><div class="col" style="gap:2px;"><span class="nm">ease-in-out</span><span class="hx">transitions · 250ms</span></div><div class="track"><div class="box e2"></div></div></div>
    <div class="row-mo" style="margin-top: 8px;">
      <div class="col" style="gap:2px;"><span class="nm">glitch</span><span class="hx">5s loop · hero text</span></div>
      <div><span class="glitch-wrap" data-text="Khaotic">Khaotic</span></div>
    </div>
  </div>
  <span class="token">--dur-fast 140 · --dur-base 250 · --dur-slow 400 · cubic-bezier(0.2, 0.8, 0.2, 1)</span>
</div></body></html>
