<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .panel { padding: 18px 24px; }
  .row-sp { display: grid; grid-template-columns: 48px auto 1fr auto; align-items: center; gap: 16px; padding: 7px 0; }
  .bar { background: var(--lime); height: 14px; border-radius: 3px; box-shadow: 0 0 10px var(--lime-dim); }
  .nm { font-family: var(--fn-mono); font-size: 12px; color: var(--text-hi); }
  .hx { font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); }
</style></head><body><div class="card">
  <span class="lbl">spacing · 4px base</span>
  <div class="glass panel">
    <div class="row-sp"><span class="hx">4</span><div class="bar" style="width:4px;"></div><span class="nm">--space-1</span><span class="hx">icon padding</span></div>
    <div class="row-sp"><span class="hx">8</span><div class="bar" style="width:8px;"></div><span class="nm">--space-2</span><span class="hx">inline gap</span></div>
    <div class="row-sp"><span class="hx">16</span><div class="bar" style="width:16px;"></div><span class="nm">--space-4</span><span class="hx">card padding</span></div>
    <div class="row-sp"><span class="hx">24</span><div class="bar" style="width:24px;"></div><span class="nm">--space-6</span><span class="hx">component gap</span></div>
    <div class="row-sp"><span class="hx">56</span><div class="bar" style="width:56px;"></div><span class="nm">--space-14</span><span class="hx">section pad-x</span></div>
    <div class="row-sp"><span class="hx">88</span><div class="bar" style="width:88px;"></div><span class="nm">5.5rem</span><span class="hx">section pad-y</span></div>
  </div>
</div></body></html>
