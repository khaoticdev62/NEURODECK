<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 12px; }
  .lock { padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
  .lock-l { background: #F0F0F8 !important; }
  .lock-l::before { display: none; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); }

  .wm { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 30px; letter-spacing: 1.5px; color: #F0F0F8; }
  .wm.dark { color: #0B0B0D; }
  .wm .k { color: var(--lime); }
  .wm .us { color: var(--uv-400); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style></head><body><div class="card">
  <span class="lbl">logo lockups</span>
  <div class="grid">
    <div>
      <div class="lock glass-tile"><span class="wm"><span class="k">K</span>haotic Labs<span class="us">_</span></span></div>
      <div class="meta"><span>wordmark · dark</span><span>canonical</span></div>
    </div>
    <div>
      <div class="lock glass-tile uv"><img src="../assets/logo-mark.svg" alt="" style="width: 64px; height: 64px;" /></div>
      <div class="meta"><span>K mark · 64×64</span><span>avatar</span></div>
    </div>
    <div>
      <div class="lock glass-tile uv"><img src="../assets/logo-glyph.svg" alt="" style="width: 96px; height: 96px;" /></div>
      <div class="meta"><span>glyph · 240</span><span>hero/fav</span></div>
    </div>
    <div>
      <div class="lock glass-tile lock-l"><span class="wm dark"><span class="k">K</span>haotic Labs<span class="us">_</span></span></div>
      <div class="meta"><span>wordmark · invert</span><span>print only</span></div>
    </div>
    <div style="grid-column: span 2;">
      <div class="lock glass-tile"><img src="../assets/logo-wordmark.svg" alt="" style="height: 44px;" /></div>
      <div class="meta"><span>wordmark · SVG</span><span>[K lime] + Labs + [_ UV blinking]</span></div>
    </div>
  </div>
</div></body></html>
