<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .col-fam { display:flex; flex-direction:column; gap: 8px; padding: 18px; }
  .role { font-family: var(--fn-mono); font-size: 10px; color: var(--lime); letter-spacing: 0.20em; text-transform: uppercase; }
  .meta { font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); }
  .swatch { font-size: 56px; line-height: 1; margin: 4px 0; }
</style></head><body><div class="card">
  <span class="lbl">type stack · the three families</span>
  <div class="grid">
    <div class="col-fam glass-tile">
      <span class="role">display</span>
      <span class="swatch" style="font-family: 'Orbitron'; font-weight: 900; color: var(--text-hi);">Aa</span>
      <span class="meta">Orbitron · 700/900</span>
      <span class="meta">headings · stats · K wordmark</span>
    </div>
    <div class="col-fam glass-tile">
      <span class="role">mono</span>
      <span class="swatch" style="font-family: 'Share Tech Mono'; color: var(--lime);">Aa</span>
      <span class="meta">Share Tech Mono · 400</span>
      <span class="meta">eyebrows · code · CTAs · IDs</span>
    </div>
    <div class="col-fam glass-tile uv">
      <span class="role" style="color: var(--uv-400);">body</span>
      <span class="swatch" style="font-family: 'Exo 2'; font-weight: 400; color: var(--text);">Aa</span>
      <span class="meta">Exo 2 · 300–600</span>
      <span class="meta">body · descriptions · UI text</span>
    </div>
  </div>
  <span class="token">Never Inter, Roboto, Arial, or system fonts in external UI.</span>
</div></body></html>
