<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { height: 104px; padding: 14px; display:flex; flex-direction:column; justify-content:space-between; }
  .swatch { width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 10px rgba(0,0,0,0.4); }
  .meta { display:flex; flex-direction: column; gap: 2px; }
  .nm { font-family: var(--fn-mono); font-size: 11px; }
  .hx { font-family: var(--fn-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
</style></head><body><div class="card">
  <span class="lbl">text scale · highest → lowest</span>
  <div class="grid">
    <div class="tile glass-tile"><div class="swatch" style="background:#F0F0F8;"></div><div class="meta"><span class="nm" style="color:#F0F0F8;">--text-hi</span><span class="hx">#F0F0F8 · headings</span></div></div>
    <div class="tile glass-tile"><div class="swatch" style="background:#B8B8C8;"></div><div class="meta"><span class="nm" style="color:#B8B8C8;">--text</span><span class="hx">#B8B8C8 · body</span></div></div>
    <div class="tile glass-tile"><div class="swatch" style="background:#5A5A6E;"></div><div class="meta"><span class="nm" style="color:#5A5A6E;">--text-dim</span><span class="hx">#5A5A6E · muted</span></div></div>
    <div class="tile glass-tile"><div class="swatch" style="background:#3A3A48;"></div><div class="meta"><span class="nm" style="color:#3A3A48;">--text-faint</span><span class="hx">#3A3A48 · disabled</span></div></div>
  </div>
  <span class="token">Off-white headings (never #FFF). Body in cool gray. Dim is muted/captions. Faint is disabled-only.</span>
</div></body></html>
