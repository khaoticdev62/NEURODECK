<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 6px 4px 20px; }
  .tile { height: 76px; display:flex; flex-direction:column; justify-content:flex-end; padding: 12px; }
  .nm { font-family: var(--fn-mono); font-size: 11px; color: var(--text-hi); }
  .hx { font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim); }
</style></head><body><div class="card">
  <span class="lbl">shadows + glows · colored halos</span>
  <div class="grid">
    <div class="tile" style="border-radius: 14px; background: linear-gradient(180deg, var(--void-3), var(--void)); box-shadow: 0 2px 6px rgba(0,0,0,0.4);"><span class="nm">shadow-1</span><span class="hx">raised</span></div>
    <div class="tile" style="border-radius: 14px; background: linear-gradient(180deg, var(--void-3), var(--void)); box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.4);"><span class="nm">shadow-2</span><span class="hx">popover</span></div>
    <div class="tile" style="border-radius: 14px; background: linear-gradient(180deg, var(--void-3), var(--void)); box-shadow: 0 0 28px rgba(163,230,53,0.40); border: 1px solid var(--lime-border);"><span class="nm" style="color: var(--lime);">glow-lime</span><span class="hx">on hover</span></div>
    <div class="tile" style="border-radius: 14px; background: linear-gradient(180deg, var(--void-3), var(--void)); box-shadow: 0 0 22px rgba(137,0,225,0.45); border: 1px solid var(--uv-border-2);"><span class="nm" style="color: var(--uv-400);">glow-uv</span><span class="hx">on focus</span></div>
  </div>
</div></body></html>
