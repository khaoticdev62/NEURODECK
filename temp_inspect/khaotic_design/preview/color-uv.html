<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1/1.15; display:flex; align-items:flex-end; padding:6px; }
  .sw .h { font-family: var(--fn-mono); font-size: 10px; font-weight: 600; position: relative; z-index: 1; }
</style></head><body><div class="card">
  <div class="row" style="justify-content: space-between;">
    <span class="lbl">ultraviolet · structural accent</span>
    <span class="token">--uv · #8900E1</span>
  </div>
  <div class="scale">
    <div class="sw swatch-glass" style="background:#F5E5FF;"><span class="h" style="color:#0B0B0D;">50</span></div>
    <div class="sw swatch-glass" style="background:#E2BEFF;"><span class="h" style="color:#0B0B0D;">100</span></div>
    <div class="sw swatch-glass" style="background:#C68DFF;"><span class="h" style="color:#0B0B0D;">200</span></div>
    <div class="sw swatch-glass" style="background:#A65BFF;"><span class="h" style="color:#0B0B0D;">300</span></div>
    <div class="sw swatch-glass" style="background:#A020F0;"><span class="h" style="color:#F0F0F8;">hi</span></div>
    <div class="sw swatch-glass" style="background:#8900E1; box-shadow: 0 1px 0 rgba(255,255,255,0.10) inset, 0 0 18px rgba(137,0,225,0.5), 0 8px 18px rgba(0,0,0,0.45);"><span class="h" style="color:#F0F0F8;">UV</span></div>
    <div class="sw swatch-glass" style="background:#6E00B5;"><span class="h" style="color:#F0F0F8;">600</span></div>
    <div class="sw swatch-glass" style="background:#530088;"><span class="h" style="color:#F0F0F8;">700</span></div>
    <div class="sw swatch-glass" style="background:#38005C;"><span class="h" style="color:#F0F0F8;">800</span></div>
    <div class="sw swatch-glass" style="background:#1D0030;"><span class="h" style="color:#F0F0F8;">900</span></div>
  </div>
  <span class="token">Borders, dividers, phase labels, secondary CTA. <strong style="color:var(--uv-400);">Never</strong> use as primary body text.</span>
</div></body></html>
