<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><style>
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1/1.15; display:flex; align-items:flex-end; padding:6px; }
  .sw .h { font-family: var(--fn-mono); font-size: 10px; font-weight: 600; color: #0B0B0D; position: relative; z-index: 1; }
</style></head><body><div class="card">
  <div class="row" style="justify-content: space-between;">
    <span class="lbl">electric lime · primary CTA</span>
    <span class="token">--lime · #A3E635</span>
  </div>
  <div class="scale">
    <div class="sw swatch-glass" style="background:#F2FFDC;"><span class="h">50</span></div>
    <div class="sw swatch-glass" style="background:#DEFFA3;"><span class="h">100</span></div>
    <div class="sw swatch-glass" style="background:#C8FF6B;"><span class="h">200</span></div>
    <div class="sw swatch-glass" style="background:#BEFF00;"><span class="h">hi</span></div>
    <div class="sw swatch-glass" style="background:#A3E635; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 0 18px rgba(163,230,53,0.5), 0 8px 18px rgba(0,0,0,0.45);"><span class="h">LIME</span></div>
    <div class="sw swatch-glass" style="background:#84C414;"><span class="h">600</span></div>
    <div class="sw swatch-glass" style="background:#659C00;"><span class="h" style="color:#F0F0F8;">700</span></div>
    <div class="sw swatch-glass" style="background:#466A00;"><span class="h" style="color:#F0F0F8;">800</span></div>
    <div class="sw swatch-glass" style="background:#2A3F00;"><span class="h" style="color:#F0F0F8;">900</span></div>
    <div class="sw swatch-glass" style="background: rgba(163,230,53,0.07);"><span class="h" style="color: #A3E635;">dim</span></div>
  </div>
  <span class="token">Primary CTAs, key data points, the K mark. <strong style="color:var(--lime);">Use sparingly.</strong> One focal lime element per surface.</span>
</div></body></html>
