<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>
  body { background: radial-gradient(120% 120% at 80% -10%, rgba(137,0,225,0.10) 0%, transparent 50%), radial-gradient(100% 100% at 0% 120%, rgba(163,230,53,0.05) 0%, transparent 55%), var(--void); }
  .card { gap: 18px; }

  .lab {
    font-family: var(--fn-mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.22em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .lab .tick { width: 6px; height: 6px; background: var(--lime); box-shadow: 0 0 8px var(--lime-glow); }

  .seg { display: flex; flex-direction: column; gap: 12px; }
  .seg-head { display: flex; align-items: baseline; justify-content: space-between; }
  .seg-sys { font-family: var(--fn-mono); font-size: 9px; color: var(--uv-400); letter-spacing: 0.2em; text-transform: uppercase; }

  /* tvOS-premium glass icon cells */
  .icons { display: flex; gap: 14px; align-items: center; }
  .ic-cell {
    width: 58px; height: 58px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--lime);
    position: relative;
    border-radius: 13px;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 40%, transparent 100%),
      linear-gradient(180deg, var(--void-4) 0%, var(--void-2) 100%);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 10px 24px rgba(0,0,0,0.55),
      0 2px 6px rgba(0,0,0,0.5);
    transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.45s, border-color 0.45s;
    transform-style: preserve-3d;
  }
  /* top sheen */
  .ic-cell::before {
    content: ""; position: absolute; inset: 1px 1px auto 1px; height: 40%;
    border-radius: 12px 12px 40px 40px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent);
    pointer-events: none;
  }
  .ic-cell:hover {
    transform: translateY(-6px) scale(1.06);
    border-color: var(--lime-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 0 0 1px var(--lime-border),
      0 22px 48px rgba(0,0,0,0.6),
      0 0 36px var(--lime-glow);
    color: var(--lime-300);
  }
  .ic-cell.uv { color: var(--uv-300); }
  .ic-cell.uv:hover {
    border-color: var(--uv-border-2);
    box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 0 0 1px var(--uv-border-2), 0 22px 48px rgba(0,0,0,0.6), 0 0 36px var(--uv-glow);
    color: var(--uv-400);
  }

  /* tech-stack emoji cells — glassy, premium, neon underlight */
  .stack { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .em-cell {
    aspect-ratio: 1; border-radius: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.05) 0%, transparent 45%),
      linear-gradient(180deg, var(--void-3) 0%, var(--void) 100%);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 20px rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
    transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.45s;
  }
  .em-cell::after {
    content: ""; position: absolute; left: 20%; right: 20%; bottom: 0; height: 2px;
    background: var(--lime); filter: blur(3px); opacity: 0; transition: opacity 0.45s;
  }
  .em-cell:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 1px 0 rgba(255,255,255,0.10) inset, 0 18px 40px rgba(0,0,0,0.6), 0 0 28px var(--lime-dim); }
  .em-cell:hover::after { opacity: 1; }
  .em { font-size: 26px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
  .em-l { font-family: var(--fn-mono); font-size: 8px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }

  /* ASCII inline strip — premium glass bar */
  .ascii-bar {
    display: flex; align-items: center; gap: 22px;
    padding: 16px 22px; border-radius: 14px;
    background: linear-gradient(180deg, var(--void-3), var(--void));
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 20px rgba(0,0,0,0.5);
  }
  .ascii-bar .g { font-family: var(--fn-mono); font-size: 22px; }
  .ascii-bar .l { color: var(--lime); text-shadow: 0 0 12px var(--lime-glow); }
  .ascii-bar .u { color: var(--uv-400); text-shadow: 0 0 12px var(--uv-glow); }
  .ascii-bar .w { color: var(--text-hi); }
  .ascii-bar .tag { margin-left: auto; font-family: var(--fn-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.2em; text-transform: uppercase; }
</style></head><body><div class="card">
  <div class="lab"><span class="tick"></span> iconography · 3 systems · tvOS-grade glass</div>

  <div class="seg">
    <div class="seg-head">
      <span class="lab" style="color: var(--text);">App UI</span>
      <span class="seg-sys">lucide · 1.5px · hover to lift</span>
    </div>
    <div class="icons">
      <span class="ic-cell"><i data-lucide="terminal" style="width:22px;height:22px;stroke-width:1.5"></i></span>
      <span class="ic-cell"><i data-lucide="zap" style="width:22px;height:22px;stroke-width:1.5"></i></span>
      <span class="ic-cell"><i data-lucide="cpu" style="width:22px;height:22px;stroke-width:1.5"></i></span>
      <span class="ic-cell uv"><i data-lucide="git-branch" style="width:22px;height:22px;stroke-width:1.5"></i></span>
      <span class="ic-cell uv"><i data-lucide="shield" style="width:22px;height:22px;stroke-width:1.5"></i></span>
      <span class="ic-cell"><i data-lucide="activity" style="width:22px;height:22px;stroke-width:1.5"></i></span>
    </div>
  </div>

  <div class="seg">
    <div class="seg-head">
      <span class="lab" style="color: var(--text);">Tech Stack</span>
      <span class="seg-sys">emoji · brand iconography</span>
    </div>
    <div class="stack">
      <div class="em-cell"><span class="em">🤖</span><span class="em-l">Claude</span></div>
      <div class="em-cell"><span class="em">🧠</span><span class="em-l">Gemini</span></div>
      <div class="em-cell"><span class="em">⚡</span><span class="em-l">Groq</span></div>
      <div class="em-cell"><span class="em">🦀</span><span class="em-l">Rust</span></div>
      <div class="em-cell"><span class="em">🐹</span><span class="em-l">Go</span></div>
      <div class="em-cell"><span class="em">☁️</span><span class="em-l">CF</span></div>
    </div>
  </div>

  <div class="seg">
    <div class="seg-head">
      <span class="lab" style="color: var(--text);">Inline</span>
      <span class="seg-sys">ascii glyphs · neon-lit</span>
    </div>
    <div class="ascii-bar">
      <span class="g l">→</span>
      <span class="g w">_</span>
      <span class="g l">█</span>
      <span class="g u">//</span>
      <span class="g w">::</span>
      <span class="g l">$</span>
      <span class="tag">currentColor · glow on accent</span>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</div></body></html>
