<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Khaotic hero background">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#8900E1" stroke-width="1" opacity="0.045"></path>
    </pattern>
    <radialGradient id="orbUv" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8900E1" stop-opacity="0.18"></stop>
      <stop offset="65%" stop-color="#8900E1" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="orbLime" cx="10%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.08"></stop>
      <stop offset="65%" stop-color="#A3E635" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="mask" cx="55%" cy="50%" r="75%">
      <stop offset="0%" stop-color="white" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </radialGradient>
    <mask id="vmask"><rect width="1200" height="600" fill="url(#mask)"></rect></mask>
  </defs>
  <rect width="1200" height="600" fill="#0B0B0D"></rect>
  <rect width="1200" height="600" fill="url(#grid)" mask="url(#vmask)"></rect>
  <rect width="1200" height="600" fill="url(#orbUv)"></rect>
  <rect width="1200" height="600" fill="url(#orbLime)"></rect>
</svg>