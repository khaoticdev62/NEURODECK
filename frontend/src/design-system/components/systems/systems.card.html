<!-- @dsCard group="Components" viewport="700x460" name="Systems — Model, Agent, Session" subtitle="ModelCard · AgentCard · SessionCard with health, trust & metadata" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-app); color:var(--nd-text-primary);
         font-family:var(--nd-font-ui); padding:20px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .secn { font-family:var(--nd-font-hud); text-transform:uppercase; letter-spacing:.16em;
          font-size:10px; color:var(--nd-text-muted); margin-bottom:8px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ModelCard, AgentCard, SessionCard, IconButton } = window.NEURODECKDesignSystem_1b2ea8;
const Ico = ({d}) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={d}/></svg>;
function Demo(){
  return (
    <div className="stack">
      <div className="grid2">
        <ModelCard name="Llama 3.1 8B" provider="Meta" location="local" status="selected"
          contextSize="8192" vram="6.2 GB" throughput="42" capabilities={["chat","tools"]}/>
        <ModelCard name="Claude Sonnet" provider="Anthropic" location="remote" status="auth-required"
          contextSize="200k" capabilities={["chat","vision","tools"]}/>
      </div>
      <div className="grid2">
        <AgentCard name="Recon" role="Read-only repo analyst" model="Llama 3.1 8B"
          trusted permissions={["filesystem","web"]} runStatus="ok"/>
        <AgentCard name="Operator" role="Shell + file edits" trusted={false}
          permissions={["shell","filesystem"]} runStatus="idle"/>
      </div>
      <div>
        <div className="secn">Sessions</div>
        <div className="col">
          <SessionCard title="Security Lab Notes" updated="2h ago" model="Llama 3.1 8B" messageCount={48}
            location="local" tags={["research"]} active
            actions={<><IconButton label="Rename" icon={<Ico d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>} size="sm"/>
            <IconButton label="Archive" icon={<Ico d="M3 8h18v12H3zM1 4h22v4H1z"/>} size="sm"/></>}/>
          <SessionCard title="Onboarding wizard copy" updated="yesterday" model="Claude Sonnet" messageCount={12}
            location="remote" tags={["writing"]}
            actions={<IconButton label="Archive" icon={<Ico d="M3 8h18v12H3zM1 4h22v4H1z"/>} size="sm"/>}/>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
