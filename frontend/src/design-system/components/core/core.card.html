<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-app); color:var(--nd-text-primary);
         font-family:var(--nd-font-ui); padding:20px; }
  .stack { display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .secn { font-family:var(--nd-font-hud); text-transform:uppercase; letter-spacing:.16em;
          font-size:10px; color:var(--nd-text-muted); margin-bottom:8px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, StatusChip, TextInput, Select, Toggle, Panel } = window.NEURODECKDesignSystem_1b2ea8;
const Ico = ({d}) => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={d}/></svg>;
const PLUS = "M12 5v14M5 12h14";
const CMD = "M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3";
const X = "M18 6 6 18M6 6l12 12";

function Demo(){
  const [name, setName] = React.useState("Security Lab Notes");
  const [model, setModel] = React.useState("Llama 3.1 8B");
  const [offline, setOffline] = React.useState(true);
  return (
    <div className="stack">
      <div>
        <div className="secn">Buttons</div>
        <div className="row">
          <Button variant="primary">Run model</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="ghost" icon={<Ico d={PLUS}/>}>New</Button>
          <Button variant="danger" shortcut="⌫">Delete</Button>
          <Button variant="success">Connect</Button>
          <Button variant="secondary" loading>Loading</Button>
        </div>
        <div className="row" style={{marginTop:10}}>
          <Button variant="primary" size="sm">Small</Button>
          <Button variant="primary" size="md">Medium</Button>
          <Button variant="primary" size="lg">Large</Button>
          <IconButton label="Command palette" icon={<Ico d={CMD}/>} variant="primary"/>
          <IconButton label="Add" icon={<Ico d={PLUS}/>}/>
          <IconButton label="Close" icon={<Ico d={X}/>} variant="danger"/>
        </div>
      </div>
      <div>
        <div className="secn">Badges &amp; status</div>
        <div className="row">
          <Badge tone="neutral">GGUF Q4</Badge>
          <Badge tone="info" dot>Remote</Badge>
          <Badge tone="agent">Agent</Badge>
          <StatusChip tone="success">Connected</StatusChip>
          <StatusChip tone="warning">Degraded</StatusChip>
          <StatusChip tone="error">Failed</StatusChip>
          <StatusChip tone="info" pulse>Running</StatusChip>
        </div>
      </div>
      <div className="grid2">
        <TextInput label="Session name" value={name} onChange={setName} icon={<Ico d="M4 7h16M4 12h16M4 17h10"/>}/>
        <Select label="Model" value={model} onChange={setModel} options={["Llama 3.1 8B","Claude Sonnet","Qwen 2.5 14B"]}/>
      </div>
      <Panel title="Offline-first mode" description="Queue prompts locally when no network is available"
        actions={<Badge tone="success" dot>On</Badge>}>
        <Toggle checked={offline} onChange={setOffline} label="Operate without remote providers"/>
      </Panel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
