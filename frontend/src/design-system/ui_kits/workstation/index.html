<!-- @dsCard group="Workstation" viewport="1280x800" name="NEURODECK Workstation" subtitle="Interactive Steam Deck app shell — chat, models, agents, sessions, command palette" -->
<!-- @startingPoint section="Workstation" subtitle="Full NEURODECK workstation shell, interactive" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURODECK — Workstation</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/neurodeck-mark.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070A; overflow: hidden; }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #0A0F15 0%, #05070A 60%);
  }
  #deck {
    width: 1280px; height: 800px; position: relative; transform-origin: center center;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--nd-border-subtle);
    box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.5);
    background: var(--nd-surface-primary);
  }
  .nd-caret { color: var(--nd-accent-primary); animation: nd-blink 1s steps(2) infinite; }
  @keyframes nd-blink { 50% { opacity: 0; } }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--nd-slate-600); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="stage">
  <div id="deck"><div id="root"></div></div>
</div>
<script type="text/babel" data-presets="env,react,typescript" src="icons.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="StatusBar.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="NavRail.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="ChatWorkspace.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="InputConsole.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="CommandPalette.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="FeatureViews.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript" src="Shell.tsx"></script>
<script type="text/babel" data-presets="env,react,typescript">
  function fit() {
    const d = document.getElementById('deck');
    const pad = 24;
    const s = Math.min((window.innerWidth - pad) / 1280, (window.innerHeight - pad) / 800, 1);
    d.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
  ReactDOM.createRoot(document.getElementById('root')).render(<window.Shell />);
</script>
</body>
</html>
