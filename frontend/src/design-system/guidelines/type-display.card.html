<!-- @dsCard group="Type" viewport="700x160" name="Display — Orbitron" subtitle="Wordmark & startup moments · uppercase, wide tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-primary); color:var(--nd-text-primary);
         padding:22px; display:flex; flex-direction:column; gap:14px; justify-content:center; }
  .wordmark { font-family:var(--nd-font-display); font-weight:800; font-size:34px;
              letter-spacing:var(--nd-tracking-wordmark); color:#E8F4FF; }
  .wordmark .glow { color:var(--nd-cyan-400); text-shadow:0 0 18px rgba(var(--nd-cyan-rgb),0.5); }
  .display { font-family:var(--nd-font-display); font-weight:700; font-size:28px; line-height:36px; color:#E8F4FF; }
  .meta { font-family:var(--nd-font-mono); font-size:11px; color:var(--nd-text-muted); }
</style>
</head>
<body>
  <div class="wordmark">NEURO<span class="glow">DECK</span></div>
  <div class="display">Local intelligence layer</div>
  <div class="meta">Orbitron · 28–34px · 700–800 · tracking 0.18–0.22em · uppercase</div>
</body>
</html>
