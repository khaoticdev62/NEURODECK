<!-- @dsCard group="Colors" viewport="700x160" name="Surface Ramp — Void to Slate" subtitle="App shell stacks dark to light by elevation, not gradient" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-app); font-family:var(--nd-font-ui);
         color:var(--nd-text-primary); padding:18px; }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .cell { height:96px; border-radius:var(--nd-radius-md); border:1px solid var(--nd-border-subtle);
          display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .name { font-size:10px; color:var(--nd-text-secondary); font-family:var(--nd-font-hud);
          text-transform:uppercase; letter-spacing:.12em; }
  .hex { font-family:var(--nd-font-mono); font-size:11px; color:var(--nd-text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell" style="background:#05070A"><span class="name">app</span><span class="hex">#05070A</span></div>
    <div class="cell" style="background:#0A0D10"><span class="name">primary</span><span class="hex">#0A0D10</span></div>
    <div class="cell" style="background:#0D1117"><span class="name">sidebar</span><span class="hex">#0D1117</span></div>
    <div class="cell" style="background:#11161C"><span class="name">secondary</span><span class="hex">#11161C</span></div>
    <div class="cell" style="background:#18212B"><span class="name">tertiary</span><span class="hex">#18212B</span></div>
    <div class="cell" style="background:#22303D"><span class="name">border</span><span class="hex">#22303D</span></div>
  </div>
</body>
</html>
