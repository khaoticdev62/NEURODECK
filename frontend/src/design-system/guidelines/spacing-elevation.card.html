<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & Focus" subtitle="Depth via shadow, not lighter fills · cyan controller focus ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-app); color:var(--nd-text-primary);
         font-family:var(--nd-font-ui); padding:26px 20px; display:flex; gap:18px; align-items:center; justify-content:space-between; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box { width:108px; height:62px; background:var(--nd-surface-secondary);
         border:1px solid var(--nd-border-subtle); border-radius:var(--nd-radius-md); }
  .tok { font-family:var(--nd-font-mono); font-size:10px; color:var(--nd-text-muted); text-align:center; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--nd-elevation-panel)"></div><span class="tok">panel</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--nd-elevation-card)"></div><span class="tok">card</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--nd-elevation-overlay)"></div><span class="tok">overlay</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--nd-elevation-focus);border-color:var(--nd-cyan-400)"></div><span class="tok">focus ring</span></div>
</body>
</html>
