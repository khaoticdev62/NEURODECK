<!-- @dsCard group="Spacing" viewport="700x150" name="Radius Scale" subtitle="0 terminal · 6 controls · 10 cards · 14 panels · 20 modals · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--nd-surface-primary); color:var(--nd-text-primary);
         font-family:var(--nd-font-ui); padding:20px; display:flex; gap:14px; align-items:center; }
  .item { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:72px; height:56px; background:var(--nd-surface-tertiary);
         border:1px solid var(--nd-border-default); border-top:2px solid var(--nd-cyan-400); }
  .tok { font-family:var(--nd-font-mono); font-size:10px; color:var(--nd-text-secondary); }
  .px { font-family:var(--nd-font-mono); font-size:10px; color:var(--nd-text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:0"></div><span class="tok">none</span><span class="px">0px</span></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><span class="tok">sm</span><span class="px">6px</span></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><span class="tok">md</span><span class="px">10px</span></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><span class="tok">lg</span><span class="px">14px</span></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><span class="tok">xl</span><span class="px">20px</span></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><span class="tok">full</span><span class="px">999px</span></div>
</body>
</html>
