<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* https: ws://localhost:* ws://127.0.0.1:* wss:; media-src 'self' data: blob:; frame-src 'self' blob: https: http:; object-src 'none'; base-uri 'self'; form-action 'self';"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <title>NEURODECK</title>
    <style>
      #boot-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
        background: #0A0D10;
        transition: opacity 0.5s ease;
      }
      #boot-loader .boot-logo {
        width: 64px; height: 64px;
        border-radius: 1rem;
        background: linear-gradient(135deg, rgba(94,235,255,0.15), rgba(124,255,178,0.08));
        border: 1px solid rgba(94,235,255,0.25);
        display: flex; align-items: center; justify-content: center;
        animation: bootPulse 2s ease-in-out infinite;
      }
      #boot-loader .boot-logo svg { width: 32px; height: 32px; color: #5EEBFF; }
      #boot-loader .boot-title {
        font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 600;
        color: #E8F4FF; letter-spacing: 0.15em; text-transform: uppercase;
      }
      #boot-loader .boot-sub {
        font-family: 'Inter', sans-serif; font-size: 0.75rem;
        color: #6B7280;
      }
      #boot-loader .boot-bar {
        width: 180px; height: 3px;
        background: rgba(255,255,255,0.06);
        border-radius: 999px; overflow: hidden;
      }
      #boot-loader .boot-bar-fill {
        width: 0%; height: 100%;
        background: linear-gradient(90deg, #5EEBFF, #7CFFB2);
        border-radius: 999px;
        animation: bootFill 1.5s ease-out forwards;
      }
      @keyframes bootPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(94,235,255,0.15); }
        50% { box-shadow: 0 0 24px 4px rgba(94,235,255,0.08); }
      }
      @keyframes bootFill {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      #boot-loader.done { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
<div id="boot-loader">
  <div class="boot-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </div>
  <div class="boot-title">NEURODECK</div>
  <div class="boot-sub">Preparing local intelligence layer…</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
