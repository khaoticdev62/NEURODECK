[package]
name = "neurodeck_infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "2.3", features = [] }
mdns-sd = "0.19"
prost = "0.12"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-stream = "0.1"
tonic = "0.11"
tracing = "0.1"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.11"
