[package]
name = "neurodeck_infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "4", features = [] }
keyring-core = "1"
mdns-sd = "0.20"
prost = "0.14"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14.6"
tracing = "0.1"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.14"
tonic-prost-build = "0.14.6"
