# ═════════════════════════════════════════════════════════════════════════════
# NEURODECK — Production Code Prompt System Configuration
# Single source of truth for AI-driven development workflows.
# ═════════════════════════════════════════════════════════════════════════════

prompt_pack: ./production_code_prompt_system/prompts
target_repo: .
output_dir: ./production_code_prompt_system/promptflow_runs

provider:
  name: manual
  model: null
  timeout_seconds: 120
  max_retries: 2

workflow:
  sequence: full
  stop_on_blocker: true
  mode: report-only
  include_orchestration: true
  require_approval_for_patches: true

# NEURODECK-specific custom sequences
sequences:
  rust-only:
    - "14"
    - "01"
    - "03"
    - "04"
    - "06"
    - "12"
    - "15"
  electron-only:
    - "14"
    - "01"
    - "11"
    - "05"
    - "04"
    - "10"
    - "15"
  pre-release:
    - "14"
    - "01"
    - "03"
    - "04"
    - "08"
    - "09"
    - "15"
  quick-check:
    - "14"
    - "01"
    - "15"

context:
  max_context_files: 80
  max_file_bytes: 200000
  include_git_status: true
  respect_gitignore: true
  redact_secrets: true
  exclude:
    - .git
    - node_modules
    - dist
    - dist-electron
    - build
    - target
    - coverage
    - .venv
    - .ruff_cache
    - .mypy_cache
    - .pytest_cache
    - __pycache__
    - .playwright-mcp
    - .fallow
    - .serena
    - .hermes
    - .loose
    - _bmad-output
    - neurodeck-production-package
    - deckcode_unzipped
    - data
    - assets/steam-grid
    - assets/steam_input
    - assets/bmad-bundle

commands:
  allow_verification_commands: true
  require_confirmation_for_commands: true
  timeout_seconds: 300

reports:
  generate_summary: true
  generate_blockers: true
  generate_warnings: true
  generate_next_actions: true
