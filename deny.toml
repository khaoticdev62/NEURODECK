# cargo-deny policy configuration for NEURODECK
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ------------------------------------------------------------------------------
# Licensing
# ------------------------------------------------------------------------------

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki-root-certs"
expression = "MPL-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]

[[licenses.clarify]]
# NEURODECK root binary — proprietary, not distributed as open-source
name = "app"
version = "1.8.0"
expression = "LicenseRef-Proprietary"
license-files = []

[[licenses.exceptions]]
# auto_generate_cdp is a build-time code-generation dep of headless_chrome
# GPL-3.0-or-later does not propagate to the binary due to build-only usage
name = "auto_generate_cdp"
version = "*"
allow = ["GPL-3.0-only", "GPL-3.0-or-later"]

# ------------------------------------------------------------------------------
# Security advisories
# ------------------------------------------------------------------------------

[advisories]
version = 2
yanked = "warn"
ignore = [
    # GTK3 bindings flagged as unmaintained — inherited from Tauri v2, no direct action
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
]

# ------------------------------------------------------------------------------
# Bans (duplicates, unwanted crates)
# ------------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ------------------------------------------------------------------------------
# Sources
# ------------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
github = ["khaoticdev62"]
