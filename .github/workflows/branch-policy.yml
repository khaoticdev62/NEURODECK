name: Branch Policy & Agent GitOps Gate

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    types: [opened, edited, synchronize, reopened]
  create:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reject-direct-push:
    name: Reject direct push to protected branches
    runs-on: ubuntu-latest
    steps:
      - name: Fail on direct push to protected branch
        run: |
          REF="${GITHUB_REF}"
          ACTOR="${GITHUB_ACTOR}"
          EVENT="${GITHUB_EVENT_NAME}"
          RELEASE_BOT="github-actions[bot]"

          is_protected() {
            case "$1" in
              refs/heads/master|refs/heads/main|refs/heads/release/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "$EVENT" = "push" ] && is_protected "$REF"; then
            if [ "$ACTOR" = "$RELEASE_BOT" ]; then
              echo "Direct push by release bot allowed for $REF"
              exit 0
            fi
            echo "❌ Direct push to protected branch $REF is not allowed. Open a pull request instead."
            exit 1
          fi

          echo "Ref $REF is not a protected branch push. OK."

  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'create' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Check branch name against allowed prefixes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          # Skip tag creation and dependabot.
          if [ -z "$BRANCH" ] || [[ "$BRANCH" == dependabot/* ]]; then
            echo "Skipping branch-name validation."
            exit 0
          fi

          ALLOWED='^(agent|feature|ui|bugfix|hotfix|docs|kfms|release)/.+$|^(master|main)$'
          if echo "$BRANCH" | grep -Eq "$ALLOWED"; then
            echo "✅ Branch name '$BRANCH' is allowed."
            exit 0
          fi

          echo "❌ Branch name '$BRANCH' does not match allowed prefixes."
          echo "Allowed prefixes: agent/, feature/, ui/, bugfix/, hotfix/, docs/, kfms/, release/"
          exit 1

  require-pr-metadata:
    name: Require PR metadata
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title prefix
        run: |
          TITLE='${{ github.event.pull_request.title }}'
          PREFIXES="\[UI\]|\[AGENT\]|\[CI\]|\[HOTFIX\]|\[BUGFIX\]|\[FEATURE\]|\[DOCS\]|\[KFMS\]|\[RELEASE\]"
          if echo "$TITLE" | grep -Eq "^($PREFIXES)"; then
            echo "✅ PR title prefix found."
          else
            echo "❌ PR title must start with one of: [UI] [AGENT] [CI] [HOTFIX] [BUGFIX] [FEATURE] [DOCS] [KFMS] [RELEASE]"
            exit 1
          fi

      - name: Validate PR body sections
        run: |
          BODY='${{ github.event.pull_request.body }}'
          for section in "## What does this PR do?" "## Type of change" "## Checklist" "## Testing"; do
            if echo "$BODY" | grep -Fq "$section"; then
              echo "✅ Found section: $section"
            else
              echo "❌ Missing required PR section: $section"
              exit 1
            fi
          done

      - name: Post agent report reminder
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `⚠️ This PR does not satisfy the KFMS branch-policy gate.\n\nPlease ensure:\n- Title starts with [UI], [AGENT], [CI], [HOTFIX], [BUGFIX], [FEATURE], [DOCS], [KFMS], or [RELEASE].\n- Body includes ## What does this PR do?, ## Type of change, ## Checklist, and ## Testing.\n- For agent PRs, include an ## Agent report section.\n\nSee docs/AGENT-GITOPS.md for details.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            }).catch(() => {});
