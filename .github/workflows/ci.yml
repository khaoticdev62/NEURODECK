name: CI

on:
  push:
    branches: [master, release/*]
  pull_request:
    branches: [master, release/*]

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libudev-dev libasound2-dev
      - name: Check
        run: cargo check --workspace
      - name: Test (lib only)
        run: cargo test --lib --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  frontend-check:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Frontend build
        run: npm run frontend:build
      - name: Frontend type-check
        run: npm run frontend:typecheck
      - name: Frontend test
        run: npm run frontend:test

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify model support registry
        run: npm run verify:model-support
      - name: Verify no production mocks
        run: npm run verify:no-production-mocks
      - name: Verify no dead code (fallow baseline)
        run: npm run verify:no-dead-code
      - name: Fallow dead-code (if available)
        run: which fallow && npm run quality:fallow:dead-code || echo "fallow not installed, using baseline"
      - name: Fallow dupes (if available)
        run: which fallow && npm run quality:fallow:dupes || echo "fallow not installed, skipping"
      - name: Fallow audit (informational)
        run: which fallow && npm run quality:fallow:audit || true
      - name: Fallow health (informational)
        run: which fallow && npm run quality:fallow:health || true

  kfms-validate:
    name: KFMS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate meta.json
        run: bash scripts/kfms/khaotic-init.sh validate
      - name: KFMS status
        run: bash scripts/kfms/khaotic-init.sh status
