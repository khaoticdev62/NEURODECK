name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          - platform: ubuntu-22.04
            bundles: appimage,deb
          - platform: macos-latest
            bundles: dmg,app

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf pkg-config libssl-dev libasound2-dev \
            protobuf-compiler

      - name: Install macOS protoc
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install Windows protoc
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          # Extract the first release entry from RELEASE_NOTES.md
          NOTES=$(awk '/^## v/{count++; if(count==2) exit; if(count==1) next} count==1' docs/RELEASE_NOTES.md)
          # Escape for GitHub Actions multiline output
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseName: "NEURODECK ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
