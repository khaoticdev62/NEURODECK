name: Nightly Quality & Health Gate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-ci:
    name: Full CI matrix
    uses: ./.github/workflows/ci.yml

  full-security:
    name: Full security scan
    uses: ./.github/workflows/security.yml

  outdated-deps:
    name: Outdated dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: npm outdated
        run: npm outdated > npm-outdated.txt || true
      - name: cargo outdated (if available)
        run: |
          cargo install cargo-outdated 2>/dev/null || true
          cargo outdated > cargo-outdated.txt || echo "cargo-outdated not available" > cargo-outdated.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-outdated-deps
          path: "*-outdated.txt"

  dead-code:
    name: Dead code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run fallow dead-code audit
        run: |
          if command -v fallow >/dev/null 2>&1 || [ -f node_modules/.bin/fallow ]; then
            npm run quality:fallow:dead-code > fallow-dead-code.txt || true
          else
            echo "fallow not installed" > fallow-dead-code.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-dead-code
          path: fallow-dead-code.txt

  health-drift:
    name: KFMS health drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare health.json score
        run: |
          CURRENT_SCORE="$(node -e "console.log(require('./infra/telemetry/health.json').release_plan.readiness_score)")"
          echo "Current health score: $CURRENT_SCORE"
          if [ "$CURRENT_SCORE" -lt 85 ]; then
            echo "❌ Health score below GO threshold (85): $CURRENT_SCORE"
            exit 1
          fi
          echo "✅ Health score OK"
