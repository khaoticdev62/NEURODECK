name: KFMS-CI Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ── Gate 1: Lint & Format ────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - run: npm ci
      - run: npm -w frontend ci

      - name: Rust Format Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: TypeScript Type Check
        run: npm run frontend:typecheck

      - name: Frontend Format Check
        run: npx prettier --check "frontend/src/**/*.{js,ts,tsx,json,css}" "frontend/index.html" || true

      - name: Python Ruff Check
        run: |
          uv run ruff check . || true
          uv run ruff format --check . || true

  # ── Gate 2: Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm -w frontend ci

      - name: Cargo Check (workspace)
        run: cargo check --workspace --all-targets

      - name: Frontend Build
        run: npm run frontend:build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── Gate 3: Test ─────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm -w frontend ci

      - name: Cargo Test (workspace)
        run: cargo test --workspace --all-targets

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-results
          path: target/debug/*.rlib
          retention-days: 3

  # ── Gate 4: E2E ──────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Playwright Browsers
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd e2e
          npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── Gate 5: KFMS Metadata ────────────────────────────────────────────────
  kfms:
    name: KFMS Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: KFMS Stamp
        run: bash scripts/khaotic-init.sh stamp

      - name: KFMS Validate
        run: bash scripts/khaotic-init.sh validate

      - name: KFMS Status
        run: bash scripts/khaotic-init.sh status

      - name: Verify KFMS artifacts are clean
        run: |
          git diff --quiet -- infra/meta/meta.json infra/telemetry/health.json infra/meta/CODENAME_REGISTRY.md docs/IMPLEMENTATION_PLAN.md || {
            echo "KFMS artifacts are out of sync. Run: bash scripts/khaotic-init.sh sync"
            exit 1
          }

  # ── Gate 6: Security Hardening ───────────────────────────────────────────
  hardening:
    name: Security Hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb
          sudo dpkg -i ripgrep_14.1.0-1_amd64.deb
      - name: Run Security Hardening Scan
        run: |
          bash scripts/security_audit.py || true
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: |
            .loose/inbox/security-hardening/
          retention-days: 14
