name: KFMS-CI Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ── Gate 1: Lint & Format ────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "neurodeck"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf pkg-config libssl-dev libasound2-dev \
            libudev-dev protobuf-compiler

      - run: npm ci
      - run: npm -w frontend ci

      - name: Rust Format Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: TypeScript Type Check
        run: npm run frontend:typecheck

      - name: Frontend Format Check
        run: npx prettier --check "frontend/src/**/*.{js,ts,tsx,json,css}" "frontend/index.html"

      - name: Verify no production mocks
        run: npm run verify:no-production-mocks

      - name: Python Ruff Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

  # ── Gate 2: Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "neurodeck"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf pkg-config libssl-dev libasound2-dev \
            libudev-dev protobuf-compiler

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm -w frontend ci

      - name: Cargo Check (workspace)
        run: cargo check --workspace --all-targets

      - name: Frontend Build
        run: npm run frontend:build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── Gate 3: Test ─────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "neurodeck"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf pkg-config libssl-dev libasound2-dev \
            libudev-dev protobuf-compiler

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm -w frontend ci

      - name: Cargo Test (workspace)
        run: cargo test --workspace --all-targets

      - name: Frontend Unit Tests (Vitest)
        run: npm run frontend:test

      - name: Verify model support registry
        run: npm run verify:model-support

      - name: Verify no dead code (fallow baseline)
        run: npm run verify:no-dead-code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-results
          path: target/debug/*.rlib
          retention-days: 3

  # ── Gate 4: E2E ──────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install root dependencies (provides electron executable)
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd e2e
          npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── Gate 5: KFMS Metadata ────────────────────────────────────────────────
  kfms:
    name: KFMS Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: KFMS Validate
        run: bash scripts/kfms/khaotic-init.sh validate

      - name: KFMS Status
        run: bash scripts/kfms/khaotic-init.sh status

  # ── Gate 6: Security Hardening ───────────────────────────────────────────
  hardening:
    name: Security Hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb
          sudo dpkg -i ripgrep_14.1.0-1_amd64.deb
      - name: Run Security Hardening Scan
        run: |
          python3 scripts/kfms/security_audit.py || true
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: |
            .loose/inbox/security-hardening/
          retention-days: 14
