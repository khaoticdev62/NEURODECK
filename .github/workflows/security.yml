name: Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust CVE & License Audit ─────────────────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # ── JavaScript CVE Audit ─────────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit --audit-level=moderate
      - run: |
          cd frontend
          npm audit --audit-level=moderate

  # ── CodeQL SAST ──────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, rust
          queries: security-extended,security-and-quality
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm -w frontend ci
      - uses: github/codeql-action/analyze@v3

  # ── Secret Scanning ──────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for high-entropy strings and known patterns
        run: |
          ! git log --all --source --remotes --patch | grep -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_-]{33})' || {
            echo "Potential secret detected in git history"
            exit 1
          }
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: master
          head: HEAD
          extra_args: --debug --only-verified

  # ── Quality Gates ────────────────────────────────────────────────────────
  quality-gates:
    name: Production Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify no production mocks
        run: npm run verify:no-production-mocks
      - name: Verify architecture boundaries
        run: npm run verify:architecture-boundaries
      - name: Verify backend security
        run: npm run verify:security
      - name: npm audit fix diff (informational)
        run: |
          npm audit --audit-level=moderate > npm-audit-report.txt || true
          npm audit fix --dry-run --json > npm-audit-fix-dryrun.json 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: security-quality-gate-artifacts
          path: |
            npm-audit-report.txt
            npm-audit-fix-dryrun.json
