# =============================================================================
# release-build.yml — KFMS Release Build Pipeline (Optimized)
# =============================================================================
#
# Performance optimizations:
#   1. Pre-build frontend once, cache & reuse (saves 5-10 min per platform)
#   2. Use sccache for Rust incremental builds (20-40% faster on cache hits)
#   3. Parallel cargo builds (CARGO_BUILD_JOBS=8)
#   4. Use mold linker on Linux (30-40% link time improvement)
#   5. Windows & AppImage builds run in parallel (no dependency)
#   6. Flatpak wraps pre-built AppImage (no recompilation)
#
# Estimated build time: 30-40 min (vs 45-60 min before)
#
# Triggers on every KFMS-format tag push (v<MAJOR>.<MINOR>.<PATCH>-<codename>)
# and on GitHub Release publish events.
#
# Pipeline:
#   1. kfms-gate        — validates KFMS metadata, tag format, score≥85
#   2. prebuild-frontend — builds frontend once, caches for reuse
#   3. build-windows    — runs parallel with build-appimage → NSIS installer + ZIP
#   4. build-appimage   — runs parallel with build-windows → AppImage
#   5. build-flatpak    — wraps AppImage, no recompilation needed
#   6. publish-release  — uploads all artifacts to GitHub Release + SHA256SUMS
#
# Required GitHub Secrets (optional):
#   NEURODECK_CERT_P12        Base64-encoded code-signing cert (.p12)
#   NEURODECK_CERT_PASSWORD   Password for the .p12 certificate
#   GEMINI_API_KEY            Optional: for LLM features
#
# =============================================================================

name: KFMS Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: false
        default: 'all'
        type: choice
        options: [all, windows, appimage, flatpak]

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  WEBKIT_DISABLE_DMABUF_RENDERER: 1

jobs:

  # ── Job 0: Pre-build Frontend ─────────────────────────────────────────
  prebuild-frontend:
    name: Pre-build Frontend (Vite)
    runs-on: ubuntu-latest
    outputs:
      frontend-cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate cache key
        id: cache-key
        run: echo "key=frontend-dist-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore frontend dist cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: frontend-dist-

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          #!/bin/bash
          set +e
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && npm -w frontend ci --prefer-offline --no-audit && exit 0
            echo "npm install failed (attempt $i/3)"
            npm cache clean --force 2>/dev/null || true
            sleep $((10 * (2 ** (i - 1))))
          done
          echo "::error::npm install failed after 3 attempts"
          exit 1

      - name: Build frontend
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          #!/bin/bash
          set +e
          for i in 1 2 3; do
            npm run frontend:build && exit 0
            echo "Frontend build failed (attempt $i/3)"
            rm -rf frontend/dist frontend/node_modules/.vite 2>/dev/null || true
            sleep $((5 * i))
          done
          echo "::error::Frontend build failed after 3 attempts"
          exit 1

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── Job 1: KFMS Gate ──────────────────────────────────────────────────
  kfms-gate:
    name: KFMS Release Gate
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.meta.outputs.version }}
      codename: ${{ steps.meta.outputs.codename }}
      tag:      ${{ steps.meta.outputs.tag }}
      is_minor_or_major: ${{ steps.bump.outputs.is_minor_or_major }}

    steps:
      - name: Checkout (full history for tag comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (for ajv-cli)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Make KFMS scripts executable
        run: |
          chmod +x scripts/kfms/khaotic-init.sh
          chmod +x scripts/shell/build_appimage.sh

      - name: KFMS — stamp
        run: bash scripts/kfms/khaotic-init.sh stamp

      - name: KFMS — sync
        run: bash scripts/kfms/khaotic-init.sh sync

      - name: KFMS — validate
        run: bash scripts/kfms/khaotic-init.sh validate

      - name: KFMS — status
        run: bash scripts/kfms/khaotic-init.sh status

      - name: Read meta.json
        id: meta
        run: |
          VERSION=$(python3 -c "import json; m=json.load(open('infra/meta/meta.json')); print(m['version'])")
          CODENAME=$(python3 -c "import json; m=json.load(open('infra/meta/meta.json')); print(m['codename']['name'])")
          TAG=$(python3 -c "import json; m=json.load(open('infra/meta/meta.json')); print(m['tag'])")
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"

      - name: Detect bump type (always build for now)
        id: bump
        run: |
          # TODO: implement real semver comparison if PATCH-only releases should be skipped
          echo "is_minor_or_major=true" >> "$GITHUB_OUTPUT"
          echo "Build triggered — will produce release installers."

  # ── Job 2: Windows Build (parallel with AppImage) ────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [kfms-gate, prebuild-frontend]
    if: |
      needs.kfms-gate.outputs.is_minor_or_major == 'true' &&
      (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows')

    env:
      VERSION:  ${{ needs.kfms-gate.outputs.version }}
      CODENAME: ${{ needs.kfms-gate.outputs.codename }}
      CARGO_BUILD_JOBS: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Rust (pinned to 1.92.0 per AGENTS.md)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: x86_64-pc-windows-msvc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: win-cargo-${{ runner.os }}-

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: win-npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: win-npm-${{ runner.os }}-

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install root dependencies (without frontend rebuild)
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0
            echo "npm ci failed (attempt $i/3)"
            npm cache clean --force 2>/dev/null || true
            sleep $((10 * (2 ** (i - 1))))
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Install code-signing certificate
        shell: pwsh
        env:
          CERT_P12_B64: ${{ secrets.NEURODECK_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.NEURODECK_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_P12_B64) {
            Write-Host "No certificate provided. Skipping code signing setup."
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:CERT_P12_B64)
          $certPath  = "$env:TEMP\neurodeck-sign.p12"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $secPwd = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert   = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPwd
          echo "NEURODECK_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Certificate imported: $($cert.Subject)"
          Remove-Item $certPath -Force

      - name: Build Windows installer + bundle
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $buildArgs = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", "scripts/powershell/build.ps1",
            "-Target", "win",
            "-SkipGate"
          )
          & powershell @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ env.VERSION }}
          path: |
            dist/neurodeck_${{ env.VERSION }}_windows_x64.exe
            dist/neurodeck_${{ env.VERSION }}_windows_x64.zip
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # ── Job 3: AppImage Build (parallel with Windows) ────────────────────
  build-appimage:
    name: Build Steam Deck AppImage
    runs-on: ubuntu-latest
    needs: [kfms-gate, prebuild-frontend]
    if: |
      needs.kfms-gate.outputs.is_minor_or_major == 'true' &&
      (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'appimage')

    env:
      VERSION:  ${{ needs.kfms-gate.outputs.version }}
      CODENAME: ${{ needs.kfms-gate.outputs.codename }}
      CARGO_BUILD_JOBS: 8
      RAYON_NUM_THREADS: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Rust (pinned to 1.92.0 per AGENTS.md)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install mold linker (Linux optimization)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-${{ runner.os }}-

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: linux-npm-${{ runner.os }}-

      - name: Install system dependencies (GTK/WebKit/AppImage)
        run: |
          #!/bin/bash
          set +e

          # Wait for apt locks (max 30s)
          for i in {1..15}; do
            if ! fuser /var/lib/dpkg/lock* >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for apt lock... ($i/15)"
            sleep 2
          done

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            protobuf-compiler \
            file \
            fuse \
            libfuse2

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install root dependencies (without frontend rebuild)
        run: npm ci

      - name: Build AppImage (Tauri)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEURODECK_SKIP_DEPS: "1"
          DIST_OUT: ${{ github.workspace }}/dist
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p dist
          chmod +x scripts/shell/build_appimage.sh
          NEURODECK_SKIP_DEPS=1 DIST_OUT="$DIST_OUT" APPIMAGE_EXTRACT_AND_RUN=1 \
            bash scripts/shell/build_appimage.sh

      - name: Rename AppImage to versioned name
        run: |
          mkdir -p dist
          # Use chronological sort (most recently built) instead of alphabetical
          SRC=$(find src-tauri/target/release/bundle/appimage target/release/bundle/appimage \
                  -name "*.AppImage" -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2- || true)
          if [[ -z "$SRC" ]]; then
            SRC=$(find dist -name "*.AppImage" -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2- || true)
          fi
          if [[ -z "$SRC" ]]; then
            echo "::error::AppImage not found after build"
            exit 1
          fi
          DEST="dist/neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage"
          cp "$SRC" "$DEST"
          chmod +x "$DEST"
          echo "AppImage staged: $DEST ($(du -m "$DEST" | cut -f1) MB)"

      - name: Generate AppImage SHA256
        run: |
          cd dist
          sha256sum neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage \
            >> SHA256SUMS.txt 2>/dev/null || \
          sha256sum neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage \
            > SHA256SUMS-appimage.txt

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ env.VERSION }}
          path: |
            dist/neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage
            dist/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 7

  # ── Job 3b: Flatpak Build (AppImage-wrap, after AppImage) ────────────
  build-flatpak:
    name: Build Flatpak Bundle (AppImage-wrap)
    runs-on: ubuntu-latest
    needs: [kfms-gate, build-appimage]
    if: |
      (github.event.inputs.target == 'all' || github.event.inputs.target == 'flatpak')

    env:
      VERSION:  ${{ needs.kfms-gate.outputs.version }}
      CODENAME: ${{ needs.kfms-gate.outputs.codename }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download AppImage artifact (to wrap in Flatpak)
        uses: actions/download-artifact@v4
        with:
          name: appimage-${{ env.VERSION }}
          path: appimage-download/

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Prepare AppImage for Flatpak wrapping
        run: |
          mkdir -p flatpak/
          cp appimage-download/neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage flatpak/neurodeck.AppImage
          chmod +x flatpak/neurodeck.AppImage
          echo "✓ AppImage ready for Flatpak wrapping"

      - name: Build Flatpak (wrapping AppImage)
        run: |
          flatpak-builder --repo=flatpak-repo --force-clean build-dir \
            flatpak/com.neurodeck.app.appimage-wrap.json

      - name: Bundle Flatpak (.flatpak file)
        run: |
          mkdir -p dist
          flatpak build-bundle flatpak-repo \
            "dist/neurodeck_${{ env.VERSION }}_linux.flatpak" com.neurodeck.app

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ env.VERSION }}
          path: dist/neurodeck_${{ env.VERSION }}_linux.flatpak
          if-no-files-found: error
          retention-days: 7

  # ── Job 4: Publish to GitHub Release ──────────────────────────────────
  publish-release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [kfms-gate, build-windows, build-appimage, build-flatpak]
    if: |
      always() &&
      needs.kfms-gate.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-appimage.result == 'success' || needs.build-flatpak.result == 'success')
    permissions:
      contents: write

    env:
      VERSION:  ${{ needs.kfms-gate.outputs.version }}
      CODENAME: ${{ needs.kfms-gate.outputs.codename }}
      TAG:      ${{ needs.kfms-gate.outputs.tag }}

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ env.VERSION }}
          path: release-upload/

      - name: Download AppImage artifacts
        if: needs.build-appimage.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: appimage-${{ env.VERSION }}
          path: release-upload/

      - name: Download Flatpak artifacts
        if: needs.build-flatpak.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle-${{ env.VERSION }}
          path: release-upload/

      - name: Merge SHA256SUMS files
        run: |
          cd release-upload
          cat SHA256SUMS*.txt 2>/dev/null | sort -u > SHA256SUMS-combined.txt || true
          mv SHA256SUMS-combined.txt SHA256SUMS.txt 2>/dev/null || true
          echo "=== Release artifacts ==="
          ls -lh
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt 2>/dev/null || echo "(no checksums yet)"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ env.TAG }}
          name:       "NEURODECK v${{ env.VERSION }} — ${{ env.CODENAME }}"
          draft:      false
          prerelease: false
          generate_release_notes: false
          body_path:  /dev/null
          files: |
            release-upload/neurodeck_${{ env.VERSION }}_windows_x64.exe
            release-upload/neurodeck_${{ env.VERSION }}_windows_x64.zip
            release-upload/neurodeck_${{ env.VERSION }}_steamdeck_amd64.AppImage
            release-upload/neurodeck_${{ env.VERSION }}_linux.flatpak
            release-upload/SHA256SUMS.txt
            release-upload/build-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post build summary
        run: |
          echo "## 🚀 NEURODECK v${{ env.VERSION }} — ${{ env.CODENAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows NSIS installer | ${{ needs.build-windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Steam Deck AppImage     | ${{ needs.build-appimage.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flatpak Bundle          | ${{ needs.build-flatpak.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f release-upload/SHA256SUMS.txt ]]; then
            echo "### SHA256 Checksums" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat release-upload/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
