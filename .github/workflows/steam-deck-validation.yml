name: Steam Deck Packaging Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: steamdeck-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-manifest-check:
    name: Dependency Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: chmod +x scripts/steamdeck/*.sh
      - run: bash scripts/steamdeck/check-feature-dependencies.sh

  installer-static-check:
    name: Installer Static Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/steamdeck/*.sh
      - run: find scripts/steamdeck -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: test -f packaging/steamdeck/runtime-manifest.json
      - run: test -f packaging/steamdeck/dependencies.json
      - run: test -f packaging/steamdeck/feature-dependencies.json
      - run: test -f packaging/steamdeck/file-manifest.json

  build-linux-package:
    name: Build Linux AppImage + Portable
    runs-on: ubuntu-latest
    needs: [dependency-manifest-check, installer-static-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf pkg-config libssl-dev libasound2-dev protobuf-compiler file fuse libfuse2 xvfb
      - run: npm ci
      - run: npm -w frontend ci
      - run: chmod +x scripts/steamdeck/*.sh
      - run: bash scripts/steamdeck/package-steamdeck.sh --target linux
      - run: bash scripts/steamdeck/validate-installer.sh --artifact "$(find dist-electron -maxdepth 1 -name '*.AppImage' | head -n 1)"
      - run: test -s packaging/steamdeck/checksums.sha256
      - run: rg -n "AIza|GOCSPX-|Bearer " dist dist-electron && exit 1 || exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: steamdeck-linux-package
          path: |
            dist/steamdeck/**
            dist-electron/*.AppImage
            dist-electron/linux-unpacked/**

  runtime-smoke-check:
    name: Runtime Smoke Check
    runs-on: ubuntu-latest
    needs: build-linux-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steamdeck-linux-package
          path: .
      - run: chmod +x scripts/steamdeck/*.sh
      - run: ls -laR dist-electron || true
      - run: xvfb-run -a bash scripts/steamdeck/validate-runtime.sh --binary dist-electron/linux-unpacked/neurodeck

  build-windows-artifact:
    name: Build Windows Proton Artifact
    runs-on: windows-latest
    needs: [dependency-manifest-check, installer-static-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm -w frontend ci
      - run: npm run frontend:build
      - run: npm run sidecar:build
      - run: npm run build:main
      - run: npx electron-builder --config electron-builder.yml --projectDir . --win
      - uses: actions/upload-artifact@v7
        with:
          name: steamdeck-windows-artifact
          path: |
            dist-electron/win-unpacked/**
            dist-electron/*.exe
            dist-electron/*.zip

  proton-package-check:
    name: Proton Package Check
    runs-on: ubuntu-latest
    needs: build-windows-artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steamdeck-windows-artifact
          path: .
      - run: chmod +x scripts/steamdeck/*.sh
      - run: ls -laR dist-electron || true
      - run: |
          set +e
          bash scripts/steamdeck/validate-proton.sh --windows-artifact dist-electron/win-unpacked
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
